<script>
const COLORS=["#C0392B","#2471A3","#1E8449","#7D3C98","#D4860A","#117A65","#BA4A00","#1A5276","#784212","#4A235A"];
const LONG_PRESS=400;
const STORAGE_KEY="jobbook-v1";
const SUPABASE_URL="https://hyavgjaqzkfaptjlyzgv.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_hRFA8VXn7YdJCIrMhfU_kQ_KDYHgxCM";

// ── Helpers ──
// All ISO date strings are parsed as LOCAL midnight so add/diff/format stay
// internally consistent — mixing UTC parsing with local reads drops a day.
function parseD(d){return typeof d==="string"&&d.length===10?new Date(d+"T00:00:00"):new Date(d);}
function toISO(d){const x=parseD(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function addDays(d,n){const x=parseD(d);x.setDate(x.getDate()+n);return x;}
function daysBetween(a,b){return Math.max(0,Math.round((parseD(b)-parseD(a))/86400000));}
function fmtShort(d){return parseD(d).toLocaleDateString("en-US",{month:"short",day:"numeric"});}
function fmtFull(d){return parseD(d).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});}
function fmtK(n){if(!n)return"$0";if(n>=1000)return"$"+(n/1000).toFixed(n%1000===0?0:1)+"k";return"$"+Math.round(n);}
function fmt$(n){return"$"+Math.round(n).toLocaleString("en-US");}
function fmtQ(n){return Math.round(n).toLocaleString("en-US");}
function num(v){const x=parseFloat(v);return isNaN(x)?0:x;}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
const $=id=>document.getElementById(id);

const today=new Date();today.setHours(0,0,0,0);

// ── Scope definitions (lo/mid/hi = labor hrs per unit ranges) ──
const SCOPES={
  walls:    {label:"Walls — paint",             trade:"paint",  lo:.015, mid:.018, hi:.022, unit:"floor sq ft"},
  ceilings: {label:"Ceilings — paint",          trade:"paint",  lo:.010, mid:.012, hi:.014, unit:"ceiling sq ft"},
  trim:     {label:"Trim — paint",              trade:"paint",  lo:.014, mid:.018, hi:.020, unit:"LF"},
  doors:    {label:"Doors — paint",             trade:"paint",  lo:1.25, mid:1.5,  hi:1.75, unit:"door"},
  popcorn:  {label:"Popcorn ceiling removal",   trade:"paint",  lo:.010, mid:.015, hi:.020, unit:"ceiling sq ft"},
  wallpaper:{label:"Wallpaper removal",         trade:"paint",  lo:.010, mid:.017, hi:.025, unit:"wall sq ft"},
  // drywall rates are solo-residential (stored internally as hrs/sq ft = 1/production rate);
  // the original 250-450 sq ft/hr style numbers are commercial-crew rates on open walls
  hang:     {label:"Drywall — hang",            trade:"drywall",lo:1/200,mid:1/150,hi:1/100,unit:"sq ft"},
  finish:   {label:"Drywall — finish (L4)",     trade:"drywall",lo:1/120,mid:1/80, hi:1/60, unit:"sq ft"},
  prime:    {label:"Drywall — prime",           trade:"drywall",lo:1/400,mid:1/300,hi:1/250,unit:"sq ft"},
  patch:    {label:"Drywall — patch / repair",  trade:"drywall",lo:.05,  mid:.15,  hi:.30,  unit:"repair sq ft"},
};
const SCOPE_ORDER=["walls","ceilings","trim","doors","popcorn","wallpaper","hang","finish","prime","patch"];
// which quantity key feeds each scope's labor
const SCOPE_QTY={walls:"floorSqft",ceilings:"ceilSqft",trim:"trimLF",doors:"doors",popcorn:"popcornSqft",
  wallpaper:"wallpaperSqft",hang:"hangSqft",finish:"finishSqft",prime:"primeSqft",patch:"patchSqft"};

function defaultSettings(){return{
  company:"",
  ratePaint:65, rateDrywall:70, hrsDay:8, dryDays:2, markup:20, profitMargin:80,
  wallFactor:2.4, trimFactor:0.33,
  labor:{walls:.018,ceilings:.012,trim:.018,doors:1.5,popcorn:.015,wallpaper:.017,hang:1/150,finish:1/80,prime:1/300,patch:.15},
  // wallCoatCov/ceilCoatCov = wall/ceiling sq ft one gallon covers in a SINGLE coat
  cov:{wallCoatCov:350,ceilCoatCov:350,trimGal:500,doorsGal:15,sheet:32,waste:10,screwSheets:7,tapeSheets:25,mudSqft:425,primeGal:300,removerGal:750,maskFactor:1.15},
  price:{wallPaint:45,ceilPaint:32,trimPaint:55,primer:28,sheet:16,screws:9,tape:7,mud:18,bead:5,remover:25,maskSqft:.05,patchSqft:1.5},
  // labor/material modifiers for coats, surface texture, and drywall finish level
  mult:{extraCoatWall:.35,extraCoatCeil:.6,textureLight:1.12,textureHeavy:1.25,finishL5lab:1.4,finishL5mud:1.35},
  reply:"Thanks for reaching out — I'd love to help with your project. Based on my current schedule, I could start as early as {date}. Let me know if that works for you and we'll get it on the books.",
  replyNow:"Thanks for reaching out — I'd love to help with your project. I'm available now and can get started right away. Let me know and we'll lock in a date.",
};}

// 2026-08 recalibration: drywall defaults moved from commercial-crew production
// rates to solo-residential ones. Stored settings still equal to the old
// defaults get bumped; anything the user customized is left untouched.
const RECAL_LABOR={hang:{old:.0033,now:1/150},finish:{old:.008,now:1/80},prime:{old:.0028,now:1/300}};
function migrateSettings(s){
  for(const k in RECAL_LABOR){
    if(s.labor&&Math.abs(s.labor[k]-RECAL_LABOR[k].old)<1e-9)s.labor[k]=RECAL_LABOR[k].now;
  }
  return s;
}

// ── State ──
let ui={tab:"est",view:"list",editId:null,quoteId:null,settingsOpen:false,setSecOpen:{Business:true},
  tsheet:null,tform:{name:"",duration:14,confidence:75,value:""},
  buffer:7,showPadding:false,forecastDays:30,expandBuffer:false,
  dragIndex:null,dragOver:null,dragReady:false,copied:false};

// pendingDeletes tracks ids removed locally that still need to be deleted
// from Supabase — cleared once a sync successfully applies them.
let data={settings:defaultSettings(),estimates:[],projects:[],nextId:1,nextEstId:1,
  pendingDeletes:{estimates:[],projects:[]}};

// auth/cloud sync state — separate from `data` since it's not persisted as-is
let sb=null;
let auth={ready:false,session:null,libFailed:false,email:"",otpSent:false,sending:false,error:"",info:"",mode:"otp"};
let cloud={status:"idle",lastSync:null,error:null}; // idle|syncing|synced|error|offline

function deepMerge(base,over){
  if(typeof base!=="object"||base===null)return over===undefined?base:over;
  const out=Array.isArray(base)?(over||base):{...base};
  if(!Array.isArray(base)&&over&&typeof over==="object"){
    for(const k in base)out[k]=deepMerge(base[k],over[k]);
    for(const k in over)if(!(k in base))out[k]=over[k];
  }
  return out;
}
function freshData(){
  return{settings:defaultSettings(),estimates:[],projects:[],nextId:1,nextEstId:1,
    pendingDeletes:{estimates:[],projects:[]}};
}
function load(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){
      const d=JSON.parse(s);
      data.settings=migrateSettings(deepMerge(defaultSettings(),d.settings||{}));
      data.estimates=d.estimates||[];data.projects=d.projects||[];
      data.nextId=d.nextId||1;data.nextEstId=d.nextEstId||1;
      data.pendingDeletes=d.pendingDeletes||{estimates:[],projects:[]};
    }
  }catch{}
}
// Writes the local cache only — always instant, works offline, never touches
// the network. Cloud sync (queueCloudSync) is layered on top of this.
function saveLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch{}}
function save(){saveLocal();queueCloudSync();}

function deleteEstimate(id){
  data.estimates=data.estimates.filter(e=>e.id!==id);
  data.pendingDeletes.estimates.push(id);
  save();
}
function deleteProject(id){
  data.projects=data.projects.filter(p=>p.id!==id);
  data.pendingDeletes.projects.push(id);
  save();
}

// ══════════════════════ CLOUD SYNC ══════════════════════
let syncTimer=null;
function queueCloudSync(){
  if(!sb||!auth.session)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncToCloud,900);
}
function updateSyncIndicator(){
  const dot=$("syncDot");
  if(!dot)return;
  const color=cloud.status==="syncing"?"#D4860A":(cloud.status==="error"||cloud.status==="offline")?"#C0392B":"#1E8449";
  const title=cloud.status==="syncing"?"Syncing…"
    :cloud.status==="error"?"Sync error: "+(cloud.error||"unknown")
    :cloud.status==="offline"?"Offline — using local cache, will sync when reconnected"
    :cloud.lastSync?"Synced "+cloud.lastSync.toLocaleTimeString():"Not yet synced";
  dot.style.background=color;dot.title=title;
}
async function syncToCloud(){
  if(!sb||!auth.session)return;
  const uid=auth.session.user.id;
  cloud.status="syncing";updateSyncIndicator();
  try{
    const now=new Date().toISOString();
    await sb.from("user_settings").upsert({user_id:uid,settings:data.settings,next_id:data.nextId,next_est_id:data.nextEstId,updated_at:now});
    if(data.estimates.length){
      const{error}=await sb.from("estimates").upsert(data.estimates.map(e=>({id:e.id,user_id:uid,data:e,updated_at:now})));
      if(error)throw error;
    }
    if(data.projects.length){
      const{error}=await sb.from("projects").upsert(data.projects.map(p=>({id:p.id,user_id:uid,data:p,updated_at:now})));
      if(error)throw error;
    }
    if(data.pendingDeletes.estimates.length){
      await sb.from("estimates").delete().eq("user_id",uid).in("id",data.pendingDeletes.estimates);
      data.pendingDeletes.estimates=[];
    }
    if(data.pendingDeletes.projects.length){
      await sb.from("projects").delete().eq("user_id",uid).in("id",data.pendingDeletes.projects);
      data.pendingDeletes.projects=[];
    }
    saveLocal();
    cloud.status="synced";cloud.lastSync=new Date();cloud.error=null;
  }catch(err){
    cloud.status="error";cloud.error=err&&err.message||String(err);
  }
  updateSyncIndicator();
}
// Pulls server state down. Adopts it wholesale only when the local cache is
// still empty (fresh device/browser) or `force` is passed — otherwise the
// current device's local copy stays authoritative and just pushes up via
// the normal save() -> queueCloudSync() path, avoiding clobbering in-progress
// edits with a stale server snapshot (no cross-device merge is attempted).
async function pullFromCloud({force=false}={}){
  if(!sb||!auth.session)return;
  const uid=auth.session.user.id;
  cloud.status="syncing";updateSyncIndicator();
  try{
    const[usRes,estRes,projRes]=await Promise.all([
      sb.from("user_settings").select("*").eq("user_id",uid).maybeSingle(),
      sb.from("estimates").select("*").eq("user_id",uid),
      sb.from("projects").select("*").eq("user_id",uid),
    ]);
    if(usRes.error)throw usRes.error;
    if(estRes.error)throw estRes.error;
    if(projRes.error)throw projRes.error;
    const us=usRes.data;
    const localEmpty=data.estimates.length===0&&data.projects.length===0;
    if(!us){
      await syncToCloud(); // first sync for this account — seed the cloud from local
    }else if(force||localEmpty){
      data.settings=migrateSettings(deepMerge(defaultSettings(),us.settings||{}));
      data.nextId=us.next_id||1;data.nextEstId=us.next_est_id||1;
      data.estimates=(estRes.data||[]).map(r=>r.data).sort((a,b)=>a.id-b.id);
      data.projects=(projRes.data||[]).map(r=>r.data);
      data.pendingDeletes={estimates:[],projects:[]};
      saveLocal();render();
    }
    cloud.status="synced";cloud.lastSync=new Date();cloud.error=null;
  }catch(err){
    cloud.status="offline";cloud.error=err&&err.message||String(err);
  }
  updateSyncIndicator();
}

// ══════════════════════ ESTIMATOR MATH ══════════════════════
function diffFactor(k,diff){
  const s=SCOPES[k];
  return diff==="easy"?s.lo/s.mid:diff==="hard"?s.hi/s.mid:1;
}
function effQ(est){
  const S=data.settings,man=est.manual||{},a={};
  if(est.mode==="rooms"){
    let f=0,w=0,t=0,d=0;
    (est.rooms||[]).forEach(r=>{
      const L=num(r.l),W=num(r.w),H=num(r.h),dr=num(r.doors);
      f+=L*W;w+=Math.max(0,2*(L+W)*H-dr*20);t+=2*(L+W);d+=dr;
    });
    a.floorSqft=Math.round(f);a.wallSqft=Math.round(w);a.ceilSqft=Math.round(f);a.trimLF=Math.round(t);a.doors=d;
  }else{
    const f=num(est.quick&&est.quick.floor);
    a.floorSqft=f;a.wallSqft=Math.round(f*S.wallFactor);a.ceilSqft=f;a.trimLF=Math.round(f*S.trimFactor);a.doors=0;
  }
  const q={};
  const eff=(k,av)=>{q[k]=man[k]?num(est.q[k]):av;};
  eff("floorSqft",a.floorSqft);eff("wallSqft",a.wallSqft);eff("ceilSqft",a.ceilSqft);
  eff("trimLF",a.trimLF);eff("doors",a.doors);
  eff("popcornSqft",q.ceilSqft);eff("wallpaperSqft",q.wallSqft);
  eff("hangSqft",0);eff("corners",0);
  eff("finishSqft",q.hangSqft);eff("primeSqft",q.finishSqft);
  eff("patchSqft",0);
  return q;
}
function compute(est){
  const S=data.settings,M=S.mult,q=effQ(est),diff=est.difficulty||"std";
  const wc=wallCoats(est),cc=ceilCoats(est),fl=finishLevel(est);
  const wallCoatMult=1+(wc-2)*M.extraCoatWall;   // labor scales from a 2-coat baseline
  const ceilCoatMult=1+(cc-1)*M.extraCoatCeil;   // ceiling labor baseline is 1 coat
  const texLab=texLabMult(est),texGal=texGalMult(est);
  const rows=[];const hrs={paint:0,drywall:0};
  SCOPE_ORDER.forEach(k=>{
    if(!est.scopes[k])return;
    const qty=q[SCOPE_QTY[k]];
    const rate=(S.labor[k]||SCOPES[k].mid)*diffFactor(k,diff);
    let h=qty*rate;
    if(k==="walls")h*=wallCoatMult*texLab;
    if(k==="ceilings")h*=ceilCoatMult*texLab;
    if(k==="finish"&&fl===5)h*=M.finishL5lab;
    rows.push({k,label:SCOPES[k].label,qty,unit:SCOPES[k].unit,h,trade:SCOPES[k].trade});
    hrs[SCOPES[k].trade]+=h;
  });
  // materials
  const mats=[];
  const add=(label,qty,unit,price,trade)=>{if(qty>0)mats.push({label,qty,unit,price,cost:qty*price,trade});};
  const c=S.cov,p=S.price;
  if(est.scopes.walls)add(`Wall paint (${wc}-coat)`,Math.ceil(q.wallSqft*wc/c.wallCoatCov*texGal),"gal",p.wallPaint,"paint");
  if(est.scopes.ceilings)add(`Ceiling paint (${cc}-coat)`,Math.ceil(q.ceilSqft*cc/c.ceilCoatCov*texGal),"gal",p.ceilPaint,"paint");
  let tg=0;
  if(est.scopes.trim)tg+=q.trimLF/c.trimGal;
  if(est.scopes.doors)tg+=q.doors/c.doorsGal;
  if(tg>0)add("Trim / door paint",Math.ceil(tg),"gal",p.trimPaint,"paint");
  if(est.scopes.popcorn)add("Plastic & masking",Math.ceil(q.popcornSqft*c.maskFactor),"sq ft",p.maskSqft,"paint");
  if(est.scopes.wallpaper)add("Wallpaper remover",Math.ceil(q.wallpaperSqft/c.removerGal),"gal",p.remover,"paint");
  let sheets=0;
  if(est.scopes.hang){
    sheets=Math.ceil(q.hangSqft/c.sheet*(1+c.waste/100));
    add("Drywall sheets (4×8)",sheets,"sheets",p.sheet,"drywall");
    add("Drywall screws",Math.ceil(sheets/c.screwSheets),"lb",p.screws,"drywall");
    add("Corner bead (8')",Math.ceil(q.corners),"sticks",p.bead,"drywall");
  }
  if(est.scopes.finish&&q.finishSqft>0){
    add(`Joint compound${fl===5?" (L5 skim)":""}`,Math.ceil(q.finishSqft/c.mudSqft*(fl===5?M.finishL5mud:1)),"buckets",p.mud,"drywall");
    add("Joint tape (500')",Math.max(1,Math.ceil(q.finishSqft/c.sheet/c.tapeSheets)),"rolls",p.tape,"drywall");
  }
  if(est.scopes.prime)add("Drywall primer",Math.ceil(q.primeSqft/c.primeGal),"gal",p.primer,"drywall");
  if(est.scopes.patch)add("Patch supplies",q.patchSqft,"sq ft",p.patchSqft,"drywall");
  const laborPaint=hrs.paint*S.ratePaint;
  const laborDry=hrs.drywall*S.rateDrywall;
  const matCost=mats.reduce((s,m)=>s+m.cost,0);
  const matCharge=matCost*(1+S.markup/100);
  const totalHrs=hrs.paint+hrs.drywall;
  // company profit is a markup on the whole job (labor + charged materials)
  const base=laborPaint+laborDry+matCharge;
  const marginPct=S.profitMargin??0;
  const profit=base*marginPct/100;
  const total=base+profit;
  const laborDays=totalHrs>0?Math.max(1,Math.ceil(totalHrs/S.hrsDay)):0;
  // mud has to dry between coats — extra calendar days on site, not billable hours
  const dryDays=laborDays&&rows.some(r=>(r.k==="finish"||r.k==="patch")&&r.h>0)?(S.dryDays||0):0;
  const days=laborDays+dryDays;
  return{q,rows,hrs,mats,laborPaint,laborDry,matCost,matCharge,base,profit,marginPct,totalHrs,total,laborDays,dryDays,days};
}
function quoteLines(est){
  const S=data.settings,c=compute(est),lines=[];
  c.rows.forEach(r=>{
    if(r.qty<=0)return;
    let desc;
    const n=fmtQ(r.qty);
    const coatWord=x=>x===1?"one coat":x===2?"two coats":x===3?"three coats":`${x} coats`;
    const texWord=texture(est)==="heavy"?", textured":texture(est)==="light"?", light texture":"";
    switch(r.k){
      case"walls":desc=`Paint interior walls, ${coatWord(wallCoats(est))}${texWord} — ${fmtQ(c.q.wallSqft)} sq ft`;break;
      case"ceilings":desc=`Paint ceilings, ${coatWord(ceilCoats(est))}${texWord} — ${n} sq ft`;break;
      case"trim":desc=`Paint trim — ${n} linear ft`;break;
      case"doors":desc=`Paint doors — ${n} door${r.qty===1?"":"s"}`;break;
      case"popcorn":desc=`Popcorn ceiling removal — ${n} sq ft`;break;
      case"wallpaper":desc=`Wallpaper removal — ${n} sq ft`;break;
      case"hang":desc=`Hang drywall — ${n} sq ft`;break;
      case"finish":desc=`Tape & finish drywall, Level ${finishLevel(est)} — ${n} sq ft`;break;
      case"prime":desc=`Prime new drywall — ${n} sq ft`;break;
      case"patch":desc=`Drywall patch & repair — ${n} sq ft`;break;
    }
    const rate=r.trade==="paint"?S.ratePaint:S.rateDrywall;
    // profit margin is folded proportionally into every customer-facing line —
    // it must never appear as its own "profit" row on a quote
    const m=1+(S.profitMargin??0)/100;
    lines.push({desc,amt:Math.round(r.h*rate*m)});
  });
  if(c.matCharge>0)lines.push({desc:"Materials & supplies",amt:Math.round(c.matCharge*(1+(S.profitMargin??0)/100))});
  return{lines,total:lines.reduce((s,l)=>s+l.amt,0),c};
}
function newEstimate(){
  return{id:data.nextEstId++,name:"",mode:"quick",quick:{floor:""},rooms:[],
    scopes:{walls:0,ceilings:0,trim:0,doors:0,popcorn:0,wallpaper:0,hang:0,finish:0,prime:0,patch:0},
    wallCoats:2,ceilCoats:1,finishLevel:4,texture:"smooth",
    q:{},manual:{},difficulty:"std",created:toISO(today),projectId:null};
}
// per-estimate modifier accessors with legacy fallbacks
function wallCoats(e){return e.wallCoats||2;}
function ceilCoats(e){return e.ceilCoats||(e.coats===2?2:1);}
function finishLevel(e){return e.finishLevel||4;}
function texture(e){return e.texture||"smooth";}
function texGalMult(e){const m=data.settings.mult,t=texture(e);return t==="heavy"?m.textureHeavy:t==="light"?m.textureLight:1;}
function texLabMult(e){return 1+(texGalMult(e)-1)/2;} // labor bump is ~half the paint bump
function getEst(id){return data.estimates.find(e=>e.id===id);}

// ══════════════════════ TIMELINE MATH ══════════════════════
function confPad(end,conf){return toISO(addDays(end,Math.round(((100-conf)/100)*14)));}
function confColor(cf){return cf>=80?"#1E8449":cf>=50?"#D4860A":"#C0392B";}
function confLabel(cf){return cf>=80?"High — minimal padding":`${cf>=50?"Medium":"Low"} — ~${Math.round(((100-cf)/100)*14)}d padding`;}
function revenueInWindow(p,days){
  if(!p.value)return 0;
  const end=new Date(p.end_date),win=addDays(today,days);
  return(end>=today&&end<=win)?p.value:0;
}
function cascade(projects,showPad){
  let cursor=toISO(today);
  return projects.map(p=>{
    const start=cursor;
    const dur=daysBetween(p.start_date,p.end_date);
    const end=toISO(addDays(start,dur));
    const padded=confPad(end,p.confidence);
    cursor=showPad?padded:end;
    return{...p,start_date:start,end_date:end,paddedEnd:padded};
  });
}
function tlDerived(){
  const projects=cascade(data.projects,ui.showPadding);
  const last=projects[projects.length-1];
  const baseEnd=last?(ui.showPadding?last.paddedEnd:last.end_date):toISO(today);
  const nextAvail=addDays(baseEnd,ui.buffer);
  const daysOut=daysBetween(today,nextAvail);
  const revTotal=projects.reduce((s,p)=>s+revenueInWindow(p,ui.forecastDays),0);
  return{projects,nextAvail,daysOut,revTotal};
}

      const{error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});
      if(error)throw error;
      auth.otpSent=true;
    }catch(err){auth.error=err&&err.message||String(err);}
    auth.sending=false;render();
    setTimeout(()=>$("authCode")?.focus(),100);
  });
  $("googleBtn")?.addEventListener("click",async()=>{
    auth.error="";

      const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.href}});

  $("authCode")?.addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,6);});

    }catch(err){
      auth.error=err&&err.message||String(err);
      auth.sending=false;render();
    }
  });
  $("resendBtn")?.addEventListener("click",()=>{auth.otpSent=false;auth.error="";render();});
}

function settingsFields(){
  const f=[];
  f.push({sec:"Business"});
  f.push({path:"company",label:"Company name (quote header)",text:1,info:"Shown at the top of the printed customer quote. Leave blank for a generic “Estimate” header."});
  f.push({path:"ratePaint",label:"Paint labor rate ($/hr)",info:"Your billable rate for all painting scopes (walls, ceilings, trim, doors, removals). Multiplied by the painting hours the estimate computes."});
  f.push({path:"rateDrywall",label:"Drywall labor rate ($/hr)",info:"Your billable rate for all drywall scopes (hang, finish, prime, patch). Kept separate so you can price drywall higher than paint."});
  f.push({path:"hrsDay",label:"Work hours per day",info:"Productive hours you bill in a day. Used only to convert total labor hours into a day count for the timeline (hours ÷ this)."});
  f.push({path:"dryDays",label:"Mud drying days",info:"Extra calendar days added to a job's duration when it includes drywall finishing or patching — coats have to dry between hands-on sessions. Affects the day count and timeline duration only, never the price. Set 0 to disable (e.g. if you run hot mud same-day)."});
  f.push({path:"markup",label:"Materials markup (%)",info:"Added on top of your raw material cost to get the customer materials charge. 20 means materials are billed at 1.20× cost. Labor is not marked up here — that’s baked into your hourly rate."});
  f.push({path:"profitMargin",label:"Profit margin (%)",info:"Company profit added on top of the whole job — labor plus materials (including their markup). 80 means every job is billed at 1.8× cost, which works out to ≈44% margin of the final price. It's folded proportionally into the customer quote's line items, never shown as its own line. Set 0 if your hourly rates already have profit built in."});
  f.push({sec:"Quick-mode factors"});
  f.push({path:"wallFactor",label:"Wall sq ft per floor sq ft",info:"Quick-totals only. Converts finished floor area into paintable wall area. ~2.4 suits typical 8–9 ft ceilings; raise for tall walls or choppy floor plans. Room-by-room mode ignores this and measures walls directly."});
  f.push({path:"trimFactor",label:"Trim LF per floor sq ft",info:"Quick-totals only. Estimates baseboard/casing linear feet from floor area. ~0.33 is a rough average; bump up for lots of windows, doors, or crown."});
  f.push({sec:"Labor production rates (at standard difficulty)"});
  const LI={walls:"Finished FLOOR sq ft painted per hour, 2-coat baseline (the coats selector scales from there). ~56/hr matches your 0.018 hrs/sq ft quick rule; your table's range was 45–65.",

  f.push({path:"cov.mudSqft",label:"Finish sq ft per mud bucket",info:"Drywall sq ft one 5-gal bucket of all-purpose compound finishes to Level 4. Level 5 uses the mud factor above."});

  f.push({path:"cov.removerGal",label:"Wall sq ft per gal remover",info:"Wall sq ft one gallon of wallpaper-remover concentrate treats."});
  f.push({path:"cov.maskFactor",label:"Masking factor (× ceiling sq ft)",info:"Plastic & masking material as a multiple of ceiling area for popcorn removal. 1.15 = 15% more than the bare ceiling size."});
  f.push({sec:"Material prices ($)"});

  return f;
}
function getPath(o,p){return p.split(".").reduce((x,k)=>x&&x[k],o);}
function setPath(o,p,v){const ks=p.split(".");const last=ks.pop();let x=o;ks.forEach(k=>x=x[k]);x[last]=v;}
function settingsHTML(){
  if(!ui.settingsOpen)return"";
  // group the flat field list into collapsible sections at each {sec} marker
  const sections=[];
  settingsFields().forEach(f=>{
    if(f.sec)sections.push({title:f.sec,fields:[]});
    else sections[sections.length-1].fields.push(f);
  });
  const renderField=f=>{
    const v=getPath(data.settings,f.path);
    const str=f.text||f.area;
    // inv fields are stored as hrs/unit but shown/edited as units-per-hour
    const shown=str?esc(v):(f.inv?+(1/v).toPrecision(3):v);
    const control=f.area
      ?`<textarea data-set="${f.path}" data-str="1" rows="3">${esc(v)}</textarea>`
      :`<input type="${f.text?"text":"number"}" ${f.text?"":'step="any" inputmode="decimal"'} ${str?'data-str="1"':""} ${f.inv?'data-inv="1"':""} data-set="${f.path}" value="${shown}"/>`;
    return`<div class="field" style="margin-bottom:12px">
      <div class="set-labelrow"><label style="margin:0">${f.label}</label>${f.info?`<button class="info-btn" type="button" data-infobtn>i</button>`:""}</div>
      ${f.info?`<div class="set-desc" style="display:none">${f.info}</div>`:""}
      ${control}
    </div>`;
  };
  return`
  <div class="overlay" id="setOverlay"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body">
      <div class="sheet-title">SETTINGS — saved as you type</div>
      ${sections.map(sec=>{
        const open=ui.setSecOpen[sec.title]===true;
        return`<div class="set-sec">
          <button type="button" class="set-sec-head" data-sec="${esc(sec.title)}">
            <span class="eyebrow" style="margin:0">${sec.title.toUpperCase()} · ${sec.fields.length}</span>
            <span class="mono set-sec-arrow" style="font-size:10px;color:#8A847A">${open?"▲":"▼"}</span>
          </button>
          <div class="set-sec-body" style="display:${open?"block":"none"}">${sec.fields.map(renderField).join("")}</div>
        </div>`;
      }).join("")}
      <button class="btn-primary" id="setDoneBtn" style="margin-top:10px">DONE</button>
    </div>
  </div>`;
}

// ══════════════════════ MAIN RENDER + BINDING ══════════════════════
function render(){
  // Auth gate: unless the Supabase library failed to load entirely (in which
  // case we fall back to pure-local mode rather than lock the user out of
  // their own cached data), the app only renders once signed in.
  if(!auth.libFailed){
    if(!auth.ready){
      $("app").innerHTML=`<div class="header" style="padding-top:56px;text-align:center"><div class="eyebrow">JOBBOOK</div></div>`;
      return;
    }
    if(!auth.session){
      $("app").innerHTML=authScreenHTML();
      bindAuthScreen();
      return;
    }
  }
  let body="";
  if(ui.tab==="est"){
    body=ui.view==="editor"?editorHTML():ui.view==="quote"?quoteHTML():estListHTML();
  }else{
    body=timelineHTML();
  }
  const offlineBanner=auth.libFailed?`<div class="field-hint no-print" style="text-align:center;padding:8px 20px;color:#C0392B">Cloud sync unavailable (offline) — working from local cache only</div>`:"";
  $("app").innerHTML=tabbarHTML()+offlineBanner+`<div>`+body+`</div>`+settingsHTML();
  bindShared();
  if(ui.tab==="est"){
    if(ui.view==="editor")bindEditor();
    else if(ui.view==="quote")bindQuote();
    else bindEstList();
  }else bindTimeline();
  bindSettings();
  updateSyncIndicator();
}

function bindShared(){
  $("tabEst")?.addEventListener("click",()=>{ui.tab="est";render();});
  $("tabTl")?.addEventListener("click",()=>{ui.tab="tl";render();});
  $("gearBtn")?.addEventListener("click",()=>{ui.settingsOpen=true;render();});
  $("signOutBtn")?.addEventListener("click",async()=>{
    if(!confirm("Sign out of JobBook? Your data stays saved in the cloud — signing back in will bring it back."))return;
    await sb.auth.signOut();
    data=freshData();
    try{localStorage.removeItem(STORAGE_KEY);}catch{}
    ui.tab="est";ui.view="list";
    // onAuthStateChange (SIGNED_OUT) clears auth.session and re-renders to the auth screen
  });
}
function bindSettings(){
  $("setOverlay")?.addEventListener("click",closeSettings);
  $("setDoneBtn")?.addEventListener("click",closeSettings);
  document.querySelectorAll("[data-set]").forEach(el=>{
    el.addEventListener("input",()=>{
      if(el.dataset.inv){
        const n=num(el.value);
        if(n>0){setPath(data.settings,el.dataset.set,1/n);save();} // typed units/hr, stored hrs/unit
        return;
      }
      setPath(data.settings,el.dataset.set,el.dataset.str?el.value:num(el.value));
      save();
    });
  });
  document.querySelectorAll("[data-infobtn]").forEach(el=>{
    el.addEventListener("click",()=>{
      const desc=el.closest(".field").querySelector(".set-desc");
      if(!desc)return;
      const show=desc.style.display==="none";
      desc.style.display=show?"block":"none";
      el.classList.toggle("on",show);
    });
  });
  // section headers toggle in place (no re-render) so scroll position and
  // any in-progress typing elsewhere in the sheet are preserved
  document.querySelectorAll("[data-sec]").forEach(el=>{
    el.addEventListener("click",()=>{
      const body=el.parentElement.querySelector(".set-sec-body");
      const open=body.style.display==="none";
      body.style.display=open?"block":"none";
      el.querySelector(".set-sec-arrow").textContent=open?"▲":"▼";
      ui.setSecOpen[el.dataset.sec]=open;
    });
  });
}
function closeSettings(){ui.settingsOpen=false;save();render();}

function refreshTotals(){
  const est=getEst(ui.editId);if(!est)return;
  const c=compute(est);
  const st=$("sumTotal");if(st)st.textContent=fmt$(c.total);
  const sh=$("sumHrs");if(sh)sh.textContent=`${c.totalHrs.toFixed(1)}h · ${c.days}d`;
  const tp=$("totalsPanel");if(tp)tp.innerHTML=totalsHTML(c);
  SCOPE_ORDER.forEach(k=>{
    const chip=$("hrs-"+k);if(!chip)return;
    const row=c.rows.find(r=>r.k===k);
    chip.textContent=(row?row.h:0).toFixed(1)+"h";
  });
  document.querySelectorAll("[data-q]").forEach(el=>{
    const k=el.dataset.q;
    if(!(est.manual&&est.manual[k])&&el!==document.activeElement)el.value=c.q[k]||"";
  });
  const rs=$("roomSum");if(rs)rs.textContent=roomSumText(c);
}

function bindEditor(){
  const est=getEst(ui.editId);if(!est)return;
  $("backBtn")?.addEventListener("click",()=>{ui.view="list";render();});
  $("eName")?.addEventListener("input",e=>{est.name=e.target.value;save();});
  document.querySelectorAll("[data-mode]").forEach(el=>{
    el.addEventListener("click",()=>{est.mode=el.dataset.mode;save();render();});
  });
  $("qFloor")?.addEventListener("input",e=>{est.quick.floor=e.target.value;save();refreshTotals();});
  $("addRoomBtn")?.addEventListener("click",()=>{
    est.rooms=est.rooms||[];
    est.rooms.push({id:Date.now(),name:"",l:"",w:"",h:8,doors:""});
    save();render();
  });
  document.querySelectorAll("[data-delroom]").forEach(el=>{
    el.addEventListener("click",e=>{
      e.stopPropagation();
      est.rooms=est.rooms.filter(r=>r.id!==+el.dataset.delroom);
      save();render();
    });
  });
  document.querySelectorAll("[data-rid]").forEach(el=>{
    el.addEventListener("input",()=>{
      const r=(est.rooms||[]).find(x=>x.id===+el.dataset.rid);
      if(!r)return;
      r[el.dataset.f]=el.value;
      save();refreshTotals();
    });
  });
  // chip groups that only affect pricing (not which fields show) update in place
  // so the page doesn't jump back to the top on each tap
  const chipGroup=(sel,pick)=>document.querySelectorAll(sel).forEach(el=>{
    el.addEventListener("click",()=>{
      el.parentElement.querySelectorAll(".chip").forEach(s=>s.classList.remove("on"));
      el.classList.add("on");
      pick(el);save();refreshTotals();
    });
  });
  chipGroup("[data-diff]",el=>est.difficulty=el.dataset.diff);
  chipGroup("[data-tex]",el=>est.texture=el.dataset.tex);
  chipGroup("[data-wcoats]",el=>est.wallCoats=+el.dataset.wcoats);
  chipGroup("[data-ccoats]",el=>est.ceilCoats=+el.dataset.ccoats);
  chipGroup("[data-flevel]",el=>est.finishLevel=+el.dataset.flevel);
  document.querySelectorAll("[data-scope]").forEach(el=>{
    el.addEventListener("click",()=>{
      const k=el.dataset.scope;
      est.scopes[k]=est.scopes[k]?0:1;
      save();render();
    });
  });
  document.querySelectorAll("[data-q]").forEach(el=>{
    el.addEventListener("input",()=>{
      const k=el.dataset.q;
      est.q[k]=el.value;
      est.manual=est.manual||{};
      est.manual[k]=true;
      const hint=$("hint-"+k);
      if(hint)hint.innerHTML=`manual · <span class="reset-link" data-reset="${k}">reset to auto</span>`;
      save();refreshTotals();
    });
  });
  $("pushBtn")?.addEventListener("click",()=>{
    const c=compute(est);
    const name=est.name||"Untitled job";
    const days=Math.max(1,c.days);
    const existing=data.projects.find(p=>p.id===est.projectId);
    if(existing){
      existing.name=name;
      existing.end_date=toISO(addDays(existing.start_date,days));
      existing.value=Math.round(c.total);
    }else{
      const last=data.projects[data.projects.length-1];
      const startDate=last?last.end_date:toISO(today);
      const p={id:data.nextId++,name,start_date:startDate,end_date:toISO(addDays(startDate,days)),confidence:75,value:Math.round(c.total)};
      data.projects.push(p);
      est.projectId=p.id;
    }
    save();ui.tab="tl";render();
  });
  $("quoteBtn")?.addEventListener("click",()=>{ui.view="quote";ui.quoteId=est.id;render();});
  $("dupBtn")?.addEventListener("click",()=>{
    const copy=JSON.parse(JSON.stringify(est));
    copy.id=data.nextEstId++;
    copy.name=(est.name||"Untitled")+" copy";
    copy.projectId=null;
    copy.created=toISO(today);
    data.estimates.push(copy);
    save();ui.editId=copy.id;render();
  });
  $("delEstBtn")?.addEventListener("click",()=>{
    if(!confirm("Delete this estimate?"))return;
    deleteEstimate(est.id);
    ui.view="list";render();
  });
}
// reset-to-auto links live inside re-rendered hints → delegate once
document.addEventListener("click",e=>{

  if(!t)return;

  const copyText=daysOut===0
    ?(data.settings.replyNow||"").replace(/\{date\}/g,fmtFull(nextAvail))
    :(data.settings.reply||"").replace(/\{date\}/g,fmtFull(nextAvail));
  $("copyBtn")?.addEventListener("click",()=>{
    navigator.clipboard?.writeText(copyText).catch(()=>{});

    setTimeout(()=>{ui.copied=false;render();},2000);
  });
  $("forecastSlider")?.addEventListener("input",e=>{ui.forecastDays=+e.target.value;render();});
  $("padToggle")?.addEventListener("change",e=>{ui.showPadding=e.target.checked;render();});
  $("bufferToggle")?.addEventListener("click",()=>{ui.expandBuffer=!ui.expandBuffer;render();});
  $("bufferSlider")?.addEventListener("input",e=>{ui.buffer=+e.target.value;render();});
  $("addBtn")?.addEventListener("click",()=>{

  });
  $("tlOverlay")?.addEventListener("click",()=>{ui.tsheet=null;render();});

  $("pDuration")?.addEventListener("input",e=>{
    ui.tform.duration=e.target.value===""?"":+e.target.value;

  });
  $("pDuration")?.addEventListener("focus",e=>e.target.select());
  $("pDuration")?.addEventListener("blur",e=>{

  $("pValue")?.addEventListener("input",e=>{ui.tform.value=e.target.value===""?"":+e.target.value;});

  $("pConf")?.addEventListener("input",e=>{

  $("pSaveBtn")?.addEventListener("click",()=>{

    el.setAttribute("draggable","true");
    el.addEventListener("dragstart",e=>{
      ui.dragIndex=i;ui.dragOver=i;
      e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",String(i));}catch{}
      el.classList.add("dragging");
    });
    el.addEventListener("dragenter",e=>{
      e.preventDefault();
      if(ui.dragIndex===null||i===ui.dragIndex)return;
      ui.dragOver=i;
      dcards.forEach(c=>c.classList.remove("dragover"));
      el.classList.add("dragover");
    });
    el.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";});
    el.addEventListener("dragend",()=>{
      if(ui.dragIndex!==null&&ui.dragOver!==null&&ui.dragIndex!==ui.dragOver)doReorder(ui.dragIndex,ui.dragOver);
      ui.dragIndex=null;ui.dragOver=null;ui.dragReady=false;render();
    });
  });
  let longTimer=null;
  document.querySelectorAll("#cardList .card").forEach((el,i)=>{
    el.addEventListener("touchstart",()=>{
      longTimer=setTimeout(()=>{ui.dragIndex=i;ui.dragReady=true;render();},LONG_PRESS);
    },{passive:true});
    el.addEventListener("touchmove",e=>{
      if(!ui.dragReady){clearTimeout(longTimer);return;}
      e.preventDefault();
      const y=e.touches[0].clientY;
      let closest=ui.dragIndex,closestDist=Infinity;
      document.querySelectorAll("#cardList .card").forEach((ref,j)=>{
        const rect=ref.getBoundingClientRect();
        const dist=Math.abs(y-(rect.top+rect.height/2));
        if(dist<closestDist){closestDist=dist;closest=j;}
      });
      if(ui.dragOver!==closest){ui.dragOver=closest;render();}
    },{passive:false});
    el.addEventListener("touchend",()=>{
      clearTimeout(longTimer);
      if(ui.dragReady&&ui.dragIndex!==null&&ui.dragOver!==null&&ui.dragIndex!==ui.dragOver)
        doReorder(ui.dragIndex,ui.dragOver);
      ui.dragIndex=null;ui.dragOver=null;ui.dragReady=false;render();
    });
  });
}
function doReorder(from,to){
  const arr=[...data.projects];
  const[item]=arr.splice(from,1);
  arr.splice(to,0,item);
  data.projects=arr;
  save();
}

// ══════════════════════ BOOTSTRAP ══════════════════════
load(); // local cache first — instant, works fully offline once signed in before
render(); // shows the "checking session" placeholder immediately

async function initAuth(){
  if(!window.supabase){
    // CDN script didn't load (offline on a device that's never connected
    // before) — fall back to local-only mode rather than lock the user out.
    auth.libFailed=true;auth.ready=true;render();
    return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  try{
    const{data:{session}}=await sb.auth.getSession(); // reads local storage, no network needed
    auth.session=session;
  }catch{}
  auth.ready=true;render();
  if(auth.session)pullFromCloud();
  sb.auth.onAuthStateChange((event,session)=>{
    const wasSignedOut=!auth.session;
    auth.session=session;
    if(event==="SIGNED_IN"&&wasSignedOut)pullFromCloud();
    render();
  });
  window.addEventListener("online",()=>{if(auth.session)queueCloudSync();});
}
initAuth();
</script>
